      - run:
          name: Define system
          command: |
            printf 'dydt = -y\n' > ode.txt
      - run:
          name: Build integrator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target rk4_adaptive -j2
      - run:
          name: Integrate with RK4
          command: LIONSS_LP=1 ./build/rk4_adaptive --system ode.txt --tol 1e-8
  VkDescriptor:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
